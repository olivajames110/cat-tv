# Render Blueprint: one web service runs the queue server and serves the built app.
services:
  - type: web
    name: cat-tv
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard
